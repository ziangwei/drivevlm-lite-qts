[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivevlm-lite"
version = "0.1.0"
description = "Lightweight and reliable driving VLM reasoning with Qwen3-VL and QTS-lite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0.0",
  "datasets>=3.0.0",
  "gradio>=4.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "opencv-python>=4.9.0",
  "pandas>=2.0.0",
  "peft>=0.13.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "qwen-vl-utils[decord]>=0.0.10",
  "rich>=13.0.0",
  "scikit-learn>=1.4.0",
  "seaborn>=0.13.0",
  "torch>=2.5.0",
  "tqdm>=4.66.0",
  "transformers>=4.57.0",
  "trl>=0.12.0",
  "typer>=0.12.0",
  "wandb>=0.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
