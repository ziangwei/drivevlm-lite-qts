[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivevlm-lite"
version = "0.1.0"
description = "Lightweight and reliable driving VLM reasoning with Qwen3-VL and QTS-lite."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are installed explicitly from stage-specific requirements
# files so server setup cannot accidentally replace the CUDA PyTorch wheel.
dependencies = []

[project.optional-dependencies]
# Development tools are installed from requirements-dev.txt when needed.
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
