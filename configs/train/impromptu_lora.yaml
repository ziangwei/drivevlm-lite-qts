model_config: configs/model/qwen3_vl_4b.yaml
train_file: data/processed_vla_impromptu/train.jsonl
eval_file: data/processed_vla_impromptu/val.jsonl
output_dir: checkpoints/qwen3vl4b_lora_impromptu_v1

use_lora: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Conservative defaults for first full Impromptu-format run on one H100.
# Bump epochs / lr after the first smoke test confirms loss curve looks sane.
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0001
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
logging_steps: 20
save_steps: 1000
eval_steps: 1000
save_total_limit: 2

max_length: null
